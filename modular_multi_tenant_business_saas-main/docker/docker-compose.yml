version: "3.9"
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
      POSTGRES_DB: erp_dev
    ports:
      - "5432:5432"
    volumes:
      - erp_pg_data:/var/lib/postgresql/data
      # Enables pgcrypto + btree_gist on first init (06 v2.0 §15, Decision DB-008)
      - ./init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  erp_pg_data:
